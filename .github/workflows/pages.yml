# Deploy the static site to GitHub Pages.
# The data (site/data) is not committed: it is published as the asset site-data.tar.gz on the "data"
# release (by `make publish` or the delta workflow) and unpacked into the site at deploy time.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'config/**', 'localization/**', 'scripts/publish_data.py', 'scripts/questions_public_preview.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/data build/published
          if gh release download data --repo "$GITHUB_REPOSITORY" --pattern site-data.tar.gz --dir build/published; then
            tar -xzf build/published/site-data.tar.gz -C site
            # the embedding text hashes are only a build cache, not used by the UI
            rm -f site/data/embeddings-hashes.json
            jq -r '"\(.stats.topics) topics, \(.runs | length) runs, embeddings: \(.embeddings.count // 0)"' site/data/manifest.json
          else
            echo "::warning::no site-data.tar.gz on the data release yet; deploying the site without data"
          fi
          # Localization is optional and cannot prevent English deployment.
          if ! gh release download data --repo "$GITHUB_REPOSITORY" --pattern localization.tar.gz --dir build/published; then
            echo "::warning::localization asset unavailable; using optional local seeds or English"
          fi
          rm -rf site/data/locales
          python3 scripts/publish_data.py prepare-localization \
            --data site/data --seeds localization --store site/data/locales \
            --archive build/published/localization.tar.gz
      - name: Verify static Requests route
        run: test -f site/requests/index.html
      - name: Install approved Questions public preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if jq -e '.enabled == true' config/questions-preview.json >/dev/null && test -f site/data/manifest.json; then
            if gh release download data --repo "$GITHUB_REPOSITORY" --pattern questions-preview.json --dir build/published; then
              node scripts/questions_public_preview.mjs --source build/published/questions-preview.json --data site/data
            else
              echo "::warning::No approved Questions preview asset; Questions stays disabled"
            fi
          fi
      - name: Gate Questions rollout
        run: |
          set -euo pipefail
          if test -f site/data/manifest.json && jq -e \
            '.private_preview == true or .publish_allowed == false' site/data/manifest.json >/dev/null; then
            echo "::error::Private preview data cannot be deployed"
            exit 1
          fi
          if test -f site/data/manifest.json; then
            node --input-type=module -e \
              'import { gateQuestionsRoute } from "./scripts/questions_public_preview.mjs"; import { rmSync } from "node:fs"; if (!gateQuestionsRoute("site/data")) rmSync("site/questions/index.html", {force:true})'
          else
            rm -f site/questions/index.html
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site # Include /requests/ alongside the root, /tips/ and /voices/.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
