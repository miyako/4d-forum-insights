name: Weekly Questions

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC, same cadence as delta.yml
  workflow_dispatch:
    inputs:
      baseline_sha256:
        description: 'Create the public-only checkpoint from this bundle digest instead of processing deltas'
        type: string
        required: false
      cleared_update_sha256:
        description: 'SHA-256 of a cleared public update asset; leave blank to verify the checkpoint'
        type: string
        required: false
      legacy_private:
        description: 'Run the older private workflow instead of the public checkpoint path'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize with Requests/Tips/Voices delta. The shared ref lease also protects local writers.
concurrency:
  group: delta
  cancel-in-progress: false

jobs:
  public-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DB_KEY: ${{ secrets.DB_KEY }}
      BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Save the published corpus as the first encrypted public baseline
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          python3 scripts/publish_data.py with-lock -- bash pipeline/ci/seed-questions-public-baseline.sh

  questions:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_private && inputs.baseline_sha256 == '' && inputs.cleared_update_sha256 == ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DB_KEY: ${{ secrets.DB_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_REDACTION_MODEL: ${{ vars.OPENAI_REDACTION_MODEL }}
      LOCALIZATION_REASONING_EFFORT: ${{ vars.LOCALIZATION_REASONING_EFFORT }}
    steps:
      - uses: actions/checkout@v7

      - name: Explicit activation gate (OFF until initial EN/FR/JA publication and PI validation)
        env:
          ENABLED: ${{ vars.QUESTIONS_WEEKLY_ENABLED }}
        run: |
          if [ "$ENABLED" != true ]; then
            echo "::error::Questions weekly readiness is OFF. Complete initial EN/FR/JA publication, measured privacy review and encrypted checkpoint seeding first."
            exit 1
          fi
          test -n "$DB_KEY" || { echo "::error::Missing DB_KEY"; exit 1; }
          test -n "$OPENAI_API_KEY" && test -n "$OPENAI_MODEL" || { echo "::error::Missing OpenAI translation configuration"; exit 1; }
          test -n "$OPENAI_REDACTION_MODEL" || { echo "::error::Missing explicit OpenAI redaction model"; exit 1; }

      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install existing pipeline tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 zstd jq >/dev/null
          (cd pipeline && uv sync -q)
          npm ci --no-audit --no-fund

      - uses: actions/cache@v6
        with:
          path: build/hf-cache
          key: hf-${{ hashFiles('config/site.json') }}

      - name: Incremental local models, cleared-only translation and encrypted checkpoint
        run: |
          umask 077
          # The lease covers pull -> source delta -> inference -> both encrypted saves.
          # Interrupted leases are never expired/stolen automatically.
          python3 scripts/publish_data.py with-lock -- bash pipeline/ci/run-questions-weekly.sh

      - name: Reviewed complete-corpus publication gate
        id: publish
        env:
          PUBLICATION_ENABLED: ${{ vars.QUESTIONS_WEEKLY_PUBLICATION_ENABLED }}
        run: |
          uv run --project pipeline python scripts/questions_weekly_publish.py
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Gate status
        if: always()
        run: |
          echo '### Weekly Questions' >> "$GITHUB_STEP_SUMMARY"
          echo 'Local Kev and enrichment; OpenAI redaction and separate review receive only exact cleared display strings, never source identity hints. Only reviewed English enters translation. Unresolved rows and incomplete FR/JA block publication. Private data/logs are never uploaded as Actions artifacts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check failing step for readiness, model, checkpoint or publication-review blockers; no deployment occurs on a failed gate.' >> "$GITHUB_STEP_SUMMARY"

  public-update:
    if: (github.event_name == 'schedule' && vars.QUESTIONS_WEEKLY_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.legacy_private && inputs.baseline_sha256 == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.update.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      DB_KEY: ${{ secrets.DB_KEY }}
      CLEARED_UPDATE_SHA256: ${{ github.event_name == 'schedule' && vars.QUESTIONS_WEEKLY_CLEARED_UPDATE_SHA256 || inputs.cleared_update_sha256 }}
      PUBLICATION_ENABLED: ${{ vars.QUESTIONS_WEEKLY_ENABLED == 'true' && vars.QUESTIONS_WEEKLY_PUBLICATION_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore checkpoint and apply a cleared update
        id: update
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          python3 scripts/publish_data.py with-lock -- python3 scripts/questions_public_weekly.py

  pages:
    needs: [questions, public-update]
    if: ${{ !cancelled() && (needs.questions.outputs.published == 'true' || needs.public-update.outputs.published == 'true') }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
